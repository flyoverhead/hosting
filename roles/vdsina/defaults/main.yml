---

vdsina_account:
  url: https://userapi.vdsina.com/v1
  api_key: ''
  country: nl

vdsina_server:
  cpu: 1
  group: Standard servers
  name: xray-nl
  # No `password`. `config | create server` posts only datacenter, name,
  # server-plan, ssh-key and template, so servers are provisioned key-only.
  # The variable used to be declared here and never sent, which only served to
  # expand a caller's vaulted secret into a dict that anything printing
  # vdsina_server would render in cleartext. Add it back together with the
  # request-body field, not before.
  ssh_key: id_ed25519
  template: Debian 12
  state: present

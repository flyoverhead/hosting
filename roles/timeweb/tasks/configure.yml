---

- name: config | ssh
  when:
    - timeweb_server.state | default('present') == 'present'
    - not ssh_key_exists
  block:

    - name: config | create ssh key
      ansible.builtin.uri:
        url: '{{ timeweb_account.url }}/ssh-keys'
        method: POST
        status_code: 201
        headers:
          Content-Type: application/json
          Authorization: Bearer {{ timeweb_account.api_key }}
        body:
          body: >-
            {{ lookup('file',
            lookup('env', 'HOME') + '/.ssh/' +
            timeweb_server.ssh_key + '.pub') }}
          is_default: false
          name: '{{ timeweb_server.ssh_key }}'
        body_format: json
      register: timeweb_ssh_key_status
      changed_when: true

    - name: config | set timeweb_ssh_key_id fact
      ansible.builtin.set_fact:
        ssh_key_id: >-
          {{ timeweb_ssh_key_status.json.ssh_key.id }}

- name: config | server
  block:

    - name: config | create server
      when:
        - not server_exists
        - timeweb_server.state | default('present') == 'present'
      block:

        - name: config | create server
          ansible.builtin.uri:
            url: '{{ timeweb_account.url }}/servers'
            method: POST
            status_code: 201
            headers:
              Content-Type: application/json
              Authorization: Bearer {{ timeweb_account.api_key }}
            body: >-
              {{ {'name': timeweb_server.name,
              'os_id': os_id | int,
              'preset_id': preset_id | int,
              'ssh_keys_ids': [ssh_key_id | int]} }}
            body_format: json
          register: timeweb_server_create_status
          changed_when: true

        - name: config | get created server info
          ansible.builtin.uri:
            url: '{{ timeweb_account.url }}/servers/{{ timeweb_server_create_status.json.server.id }}'
            method: GET
            status_code: 200
            headers:
              Content-Type: application/json
              Authorization: Bearer {{ timeweb_account.api_key }}
          register: timeweb_server_create_info
          until: timeweb_server_create_info.json.server.status == 'on'
          retries: 3
          delay: 90

        - name: config | set ansible_host fact
          ansible.builtin.set_fact:
            ansible_host: >-
              {{ timeweb_server_create_info.json.server.networks |
              selectattr('type', 'equalto', 'public') |
              map(attribute='ips') | flatten |
              selectattr('type', 'equalto', 'ipv4') |
              selectattr('is_main', 'equalto', true) |
              map(attribute='ip') | first }}

- name: config | save ansible_host fact
  ansible.builtin.lineinfile:
    path: '{{ inventory_dir }}/host_vars/{{ inventory_hostname }}.yml'
    regexp: '^ansible_host:'
    line: 'ansible_host: {{ ansible_host }}'
  when:
    - timeweb_server.state | default('present') == 'present'

- name: config | delete server
  ansible.builtin.uri:
    url: '{{ timeweb_account.url }}/servers/{{ server_id }}'
    method: DELETE
    status_code:
      - 200
      - 204
    headers:
      Content-Type: application/json
      Authorization: Bearer {{ timeweb_account.api_key }}
  changed_when: true
  when:
    - server_exists
    - timeweb_server.state | default('present') == 'absent'

---

- name: vps | check
  ansible.builtin.uri:
    url: >-
      {{ inferno_account.url + 'getinfo' +
      '&cid=' + inferno_account.cid | string +
      '&key=' + inferno_account.key +
      '&orderid=' + inferno_order_id }}
    method: GET
    status_code: 200
    headers:
      Content-Type: application/json
  register: inferno_vps_info
  until: inferno_vps_info.json.vps_info.online | bool
  retries: 30
  delay: 10

---

- name: detect | add ssh keys
  ansible.builtin.uri:
    url: >-
      {{ inferno_account.url + 'sshkey.add' }}
    method: GET
    status_code: 200
    headers:
      Content-Type: application/json
      X-Key: '{{ inferno_account.key }}'
    body:
      cid: '{{ inferno_account.cid | string }}'
      sshkey: >-
        {{ lookup('file',
        lookup('env', 'HOME') + '/.ssh/' +
        inferno_vps.ssh_key + '.pub') }}
    body_format: json
  register: ssh_key_result
  changed_when: "'added' in ssh_key_result.json.message"

- name: config | reinstall vps
  ansible.builtin.uri:
    url: >-
      {{ inferno_account.url + 'reinstall' +
      '&cid=' + inferno_account.cid | string +
      '&key=' + inferno_account.key +
      '&orderid=' + inferno_vps_order_id +
      '&ostlp=' + inferno_template +
      '&sshkey_ids=' + inferno_ssh_key_id +
      '&run=' + inferno_vps_reinstall | string }}
    method: GET
    status_code: 200
    headers:
      Content-Type: application/json
  register: server_reinstall
  changed_when: server_reinstall.json.result == 'success'
  when:
    - inferno_vps_reinstall | bool
  notify:
    - vps | check

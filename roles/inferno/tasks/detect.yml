---

- name: detect | get templates list
  ansible.builtin.uri:
    url: >-
      {{ inferno_account.url + 'list' }}
    method: GET
    status_code: 200
    headers:
      Content-Type: application/json
  register: inferno_templates_info

- name: detect | set inferno_template fact
  ansible.builtin.set_fact:
    inferno_template: >-
      {{ inferno_templates_info.json.ostpls | list |
      select('match', inferno_server.template) | first }}

- name: detect | get orders info
  ansible.builtin.uri:
    url: >-
      {{ inferno_account.url + 'orders' +
      '&cid=' + inferno_account.cid | string +
      '&key=' + inferno_account.key }}
    method: GET
    status_code: 200
    headers:
      Content-Type: application/json
  register: inferno_orders_info

- name: detect | get vps info
  run_once: true
  ansible.builtin.uri:
    url: >-
      {{ inferno_account.url + 'getinfo' +
      '&cid=' + inferno_account.cid | string +
      '&key=' + inferno_account.key + '&orderid=' + item }}
    method: GET
    status_code: 200
    headers:
      Content-Type: application/json
  register: inferno_vps_info
  loop: '{{ inferno_orders_info.json.orders.keys() }}'

- name: detect | set inferno_order_id fact
  ansible.builtin.set_fact:
    inferno_order_id: >-
      {{ inferno_vps_info.results | map(attribute='json') |
      selectattr('vps_info.ip', 'equalto', ansible_host) |
      map(attribute='orderid') | first }}

- name: detect | get ssh keys
  ansible.builtin.uri:
    url: >-
      {{ inferno_account.url + 'sshkey.list' +
      '&cid=' + inferno_account.cid | string +
      '&key=' + inferno_account.key }}
    method: GET
    status_code: 200
    headers:
      Content-Type: application/json
  register: inferno_ssh_keys_info

- name: detect | set inferno_ssh_key_exists fact
  ansible.builtin.set_fact:
    inferno_ssh_key_exists: >-
      {{ true if
      inferno_ssh_keys_info.json.list | selectattr('name', 'equalto', inferno_server.ssh_key) | length > 0
      else false }}

# Guarded because `first` on an empty selection raises, and on a fresh account
# the key does not exist until `config | add ssh keys` uploads it. config.yml
# sets this same fact from the upload response in that case.
- name: detect | set inferno_ssh_key_id fact
  ansible.builtin.set_fact:
    inferno_ssh_key_id: >-
      {{ inferno_ssh_keys_info.json.list |
      selectattr('name', 'equalto', inferno_server.ssh_key) |
      map(attribute='id') | first }}
  when:
    - inferno_ssh_key_exists

- name: detect | set inferno_reinstall fact
  ansible.builtin.set_fact:
    inferno_reinstall: '{{ inferno_server.reinstall | int }}'
